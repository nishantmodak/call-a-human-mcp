[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "call-a-human-mcp"
version = "0.1.0"
description = "MCP server for human-in-the-loop approvals and questions via Slack or Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["mcp", "human-in-the-loop", "slack", "telegram", "ai", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "mcp[cli]>=1.6.0",
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
call-a-human-mcp = "call_a_human_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/call_a_human_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
